version: 2
updates:
    # Keeps the digest-pinned PHP base image current (tag prefix 8.5.12-cli is
    # kept in sync; Dependabot bumps the sha256 digest when PHP publishes a new build)
    - package-ecosystem: "docker"
      directory: "/"
      schedule:
          interval: "weekly"
      ignore:
          # Dependabot parses docker ignore versions as Gem (Bundler)
          # requirements matched against the lowercased tag, so this range
          # covers 8.6.0 beta/RC/snapshot tags (e.g. 8.6.0RC2-cli) while
          # still allowing 8.5.x security patches and 8.6.0 stable through.
          - dependency-name: "php"
            versions: [">= 8.6.0beta, < 8.6.0"]

    - package-ecosystem: "npm"
      directory: "/"
      schedule:
          interval: "weekly"

    - package-ecosystem: "composer"
      directory: "/"
      schedule:
          interval: "weekly"
