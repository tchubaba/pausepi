version: 2
updates:
    # Keeps the digest-pinned PHP base image current (tag prefix 8.5.12-cli is
    # kept in sync; Dependabot bumps the sha256 digest when PHP publishes a new build)
    - package-ecosystem: "docker"
      directory: "/"
      schedule:
          interval: "weekly"
      ignore:
          # Dependabot's docker resolver proposes the newest tag with no semver
          # range to filter against, so pre-release tags (e.g. 8.6.0RC2-cli)
          # must be excluded explicitly.
          - dependency-name: "php"
            versions: ["*RC*", "*rc*", "*Beta*", "*beta*", "*Alpha*", "*alpha*", "*Snapshot*", "*snapshot*", "*Dev*", "*dev*"]

    - package-ecosystem: "npm"
      directory: "/"
      schedule:
          interval: "weekly"

    - package-ecosystem: "composer"
      directory: "/"
      schedule:
          interval: "weekly"
